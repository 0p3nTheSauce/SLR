program: /home/luke/Code/SLR/src/sweeping.py
method: bayes
metric:
  name: Best/Val_acc
  goal: maximize
entity: ljgoodall2001-rhodes-university
project: WLASL-100

early_terminate:
  type: hyperband
  min_iter: 15
  eta: 3

parameters:
  optimizer.backbone_init_lr:
    distribution: log_uniform_values
    min: 0.00002
    max: 0.0004

  optimizer.classifier_init_lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.004

  optimizer.backbone_weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005

  optimizer.classifier_weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005

  model_params.drop_p:
    values: [0.3, 0.4, 0.5, 0.6, 0.7]

  scheduler.t0:
    values: [10, 20, 40]

  data.train_augs.temporal_aug.0.max_wobble:
    values: [0, 2, 4, 6]

  data.train_augs.spatial_aug.2.magnitude:
    values: [5, 7, 9, 12]

command:
  - ${env}
  - python
  - ${program}
  - MViTv2_B_32x3
  - asl100
  - --base_config
  - /home/luke/Code/SLR/src/configfiles/sweeps/MViTv2_B_32x3/sweep_base.toml

