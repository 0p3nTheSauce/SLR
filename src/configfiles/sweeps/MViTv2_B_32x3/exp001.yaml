program: /home/luke/Code/SLR/src/sweeping.py
method: bayes
controller: 
  type: local
metric:
  name: Best/Val_acc
  goal: maximize
entity: ljgoodall2001-rhodes-university
project: WLASL-100

early_terminate:
  type: hyperband
  min_iter: 15
  eta: 3

parameters:
  backbone_init_lr:
    distribution: log_uniform_values
    min: 0.00002
    max: 0.0004
  classifier_init_lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.004
  backbone_weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  drop_p:
    values: [0.3, 0.4, 0.5, 0.6, 0.7]
  t0:
    values: [10, 20, 40]
  max_wobble:
    values: [0, 2, 4, 6]
  magnitude:
    values: [5, 7, 9, 12]

command:
  - ${env}
  - python
  - ${program}
  - MViTv2_B_32x3
  - asl100
  - --base_config
  - /home/luke/Code/SLR/src/configfiles/sweeps/MViTv2_B_32x3/sweep_base.toml