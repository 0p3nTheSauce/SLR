program: /home/luke/Code/SLR/src/sweeping.py
method: bayes
controller: 
  type: local
metric:
  name: Best/Val_acc
  goal: maximize
entity: ljgoodall2001-rhodes-university
project: WLASL-100

early_terminate:
  type: hyperband
  min_iter: 15
  eta: 3

parameters:
  backbone_init_lr:
    distribution: log_uniform_values
    min: 0.000005
    max: 0.0008
  classifier_init_lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.005
  backbone_weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  classifier_weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  drop_p:
    distribution: uniform
    min: 0.1
    max: 0.7
  t0:
    distribution: int_uniform
    min: 10
    max: 40
  tmult:
    values: [1, 2]
  max_wobble:
    distribution: int_uniform
    min: 0
    max: 6
  magnitude:
    distribution: int_uniform
    min: 3
    max: 15
  num_ops:
    values: [1, 2, 3]

command:
  - ${env}
  - python
  - ${program}
  - MViTv2_B_32x3
  - asl100
  - --base_config
  - /home/luke/Code/SLR/src/configfiles/sweeps/MViTv2_B_32x3/sweep_base.toml

