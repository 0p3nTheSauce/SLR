[training]
batch_size = 4
update_per_step = 2
max_epoch = 200

[optimizer]
eps = 0.01
backbone_init_lr = 0.0001
backbone_weight_decay = 0.001
classifier_init_lr = 0.001
classifier_weight_decay = 0.001

[model_params]
drop_p = 0.5

[data.train_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "og", randomise = false },
]
spatial_aug = [
    { frame_size = 224, type = "Random_crop" },
    { type = "HORIZONTAL_FLIP", p = 0.5 },
]

[data.test_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "og", randomise = false },
]
spatial_aug = [
    { frame_size = 224, type = "Centre_crop" },
]

[scheduler]
type = "CosineAnnealingWarmRestarts"
t0 = 10
tmult = 1
eta_min = 1e-05

[scheduler.warm_up]
start_factor = 0.1
end_factor = 1.0
warmup_epochs = 10

[stopping]
type = "early_stopper"
metric = "loss"
phase = "val"
mode = "min"
patience = 50
min_delta = 0.01


