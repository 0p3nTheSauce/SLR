# Ablation 2 of the final config: MViTv2_S_e_woitlmw6.toml with no augmentation. Training uses the
# test pipeline (uniform sampler, centre crop), as in AugComparison/no_aug.toml.
# Thesis msg 15 Nov 2026 (Luke approved; low priority, added only if it finishes in time): asl100,
# seed 42, one run, compared against the woitlmw6 seed study (Que_v2 jobs 79-88, test top-1
# 81.20 +- 1.28). Ablation 4 (SSv2 init) was skipped: torchvision has only K400 weights for MViTv2-S.

[training]
batch_size = 2
update_per_step = 4
max_epoch = 50

[optimizer]
eps = 3e-06
backbone_init_lr = 0.00023116002288704412
backbone_weight_decay = 0.0523421572232225
classifier_init_lr = 0.00020605381091671305
classifier_weight_decay = 0.0001

[model_params]
drop_p = 0.4420840493890998

[data]
strict_size = true
target_length = 32
frame_size = 224

[data.train_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "uniform" },
]
spatial_aug = [
    { frame_size = 224, type = "Centre_crop" },
]
strict_size = true
target_length = 32
frame_size = 224

[data.test_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "uniform" },
]
spatial_aug = [
    { frame_size = 224, type = "Centre_crop" },
]
strict_size = true
target_length = 32
frame_size = 224

[scheduler]
type = "CosineAnnealingLR"
tmax = 27
eta_min = 1e-06
hold_after_tmax = true

[scheduler.warm_up]
start_factor = 0.1
end_factor = 1.0
warmup_epochs = 5

[stopping]
type = "early_stopper"
metric = "loss"
phase = "val"
mode = "min"
patience = 15
min_delta = 0.01
