# Thesis final MViTv2-S results (5 Nov 2026, replacing job 4 if done in time): MViTv2_S_e sweep 2's
# best trial woitlmw6 (flx99idx, Que_v2 job 55, best val loss 0.574), unchanged, including
# max_epoch 50 with patience 15 (Luke chose the sweep's config verbatim over job 4's one-cycle cap).
# Stage 1 is job 55 itself (corrected asl100 from K400, seed 42); asl300, asl1000 and asl2000 each
# start from the previous stage's best.pth on the corrected 0-based splits, e.g.
#   que2 submit base train model=MViTv2_S_e split=asl300 seed=42 \
#     config=src/configfiles/thesis_final/MViTv2_S_e_woitlmw6.toml \
#     -w src/runs/asl100/MViTv2_S_e/sweep_flx99idx/job55/checkpoints/best.pth
#   que2 submit base train_chained model=MViTv2_S_e split=asl1000 seed=42 --after <asl300 job> \
#     config=src/configfiles/thesis_final/MViTv2_S_e_woitlmw6.toml

[training]
batch_size = 2
update_per_step = 4
max_epoch = 50

[optimizer]
eps = 3e-06
backbone_init_lr = 0.00023116002288704412
backbone_weight_decay = 0.0523421572232225
classifier_init_lr = 0.00020605381091671305
classifier_weight_decay = 0.0001

[model_params]
drop_p = 0.4420840493890998

[data]
strict_size = true
target_length = 32
frame_size = 224

[data.train_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 3, type = "chunked" },
]
strict_size = true
target_length = 32
frame_size = 224

[[data.train_augs.spatial_aug]]
type = "HORIZONTAL_FLIP"
p = 0.4

[[data.train_augs.spatial_aug]]
frame_size = 224
type = "Centre_crop"

[[data.train_augs.spatial_aug]]
type = "RANDAUGMENT"
num_ops = 3
magnitude = 13
num_magnitude_bins = 31
interpolation = "bilinear"

[data.test_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "uniform" },
]
spatial_aug = [
    { frame_size = 224, type = "Centre_crop" },
]
strict_size = true
target_length = 32
frame_size = 224

[scheduler]
type = "CosineAnnealingLR"
tmax = 27
eta_min = 1e-06
hold_after_tmax = true

[scheduler.warm_up]
start_factor = 0.1
end_factor = 1.0
warmup_epochs = 5

[stopping]
type = "early_stopper"
metric = "loss"
phase = "val"
mode = "min"
patience = 15
min_delta = 0.01
