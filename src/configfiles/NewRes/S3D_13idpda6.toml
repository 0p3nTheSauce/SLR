[training]
batch_size = 2
update_per_step = 4
max_epoch = 200

[optimizer]
eps = 2.0283092206015985e-06
backbone_init_lr = 0.00020500428310895295
backbone_weight_decay = 0.0005081077454495684
classifier_init_lr = 0.000883476887507909
classifier_weight_decay = 0.0004472201512928868

[model_params]
drop_p = 0.27757920392425955

[data.train_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "chunked" },
]

[[data.train_augs.spatial_aug]]
type = "HORIZONTAL_FLIP"
p = 0.07761593328956828

[[data.train_augs.spatial_aug]]
frame_size = 224
type = "Centre_crop"

[[data.train_augs.spatial_aug]]
type = "RANDAUGMENT"
num_ops = 3
magnitude = 11
num_magnitude_bins = 31
interpolation = "bilinear"

[data.test_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "uniform" },
]
spatial_aug = [
    { frame_size = 224, type = "Centre_crop" },
]

[scheduler]
type = "CosineAnnealingWarmRestarts"
t0 = 17
tmult = 1
eta_min = 0.0

[scheduler.warm_up]
start_factor = 0.007963848084594997
end_factor = 1.0
warmup_epochs = 5

[stopping]
type = "early_stopper"
metric = "loss"
phase = "val"
mode = "min"
patience = 20
min_delta = 0.01


