[training]
# batch_size = 1
# update_per_step = 8
batch_size_equivalent = 8
# max_epoch = 200

[optimizer]
eps = 1e-5
backbone_init_lr = 1e-4
backbone_weight_decay = 1e-3
classifier_init_lr = 1e-3
classifier_weight_decay = 1e-3

[model_params]
drop_p = 0.5

[data]
strict_size = true
target_length = 32
frame_size = 224

[data.train_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "og", randomise = false },
]
spatial_aug = [
    { frame_size = 224, type = "Random_crop" },
    { type = "HORIZONTAL_FLIP", p = 0.5 },
]

[data.test_augs]
normalise = true
temporal_aug = [
    { target_length = 32, max_wobble = 0, type = "og", randomise = false },
]
spatial_aug = [
    { frame_size = 224, type = "Centre_crop" },
]


[stopping]
metric = "loss"
phase = "val"
mode = "min"
min_delta = 0.01
patience = 15
