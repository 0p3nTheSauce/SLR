# Job templates for Que_v2 (~/Code/Que). Submit with, for example:
#   que2 submit base train model=MViTv2_S_e split=asl100 config=src/configfiles/asl100/MViTv2_S_e/exp000.toml --seeds 0,1,2
# Paths in key=value arguments are relative to the repo root (the job's working directory).
project = "base"
env = "wlasl"
# Gitignored; symlinked into each worktree. Labels/videos, run outputs, slowfast MViT weights.
shared = ["data", "src/runs", "src/models/mvit/weights"]

# One run: train, then test the best-val-loss checkpoint (src/train_and_test.py). Outputs go to
# src/runs/<split>/<model>/<run_name>/, with the results summary in run.json. A resume checkpoint
# is saved every epoch, and every attempt resumes from it, so a failed run is retried by
# resubmitting it unchanged (refused if its config changed). Preemptible: on SIGTERM the
# unfinished epoch is dropped and the job exits 75, so a preemption costs up to one epoch.
[templates.train]
command = "python -m src.train_and_test {model} {split} {config} --seed {seed} --run_name {run_name}"
preemptible = true
# Stopping is quick (no save on SIGTERM); this covers wandb finishing the run.
grace_seconds = 120
run_name = "{config_stem}_s{seed}"
defaults = { seed = 0 }
outputs = ["src/runs/{split}/{model}/{run_name}"]
# Largest batch-size-1 training peak in src/results/all_benchmark.json (2026-09-12, RTX 3060) is
# 6.4 GB (Swin3D_B, 32 frames); 8 leaves room for dataloader and CUDA context overhead.
min_gpu_mem_gb = 8

# A stage of a chain: like `train`, but initialised from the best checkpoint of the job it runs
# after (submit with `--after <previous stage's job id>`; one dependency, the previous stage).
[templates.train_chained]
command = "python -m src.train_and_test {model} {split} {config} --seed {seed} --run_name {run_name} -w {after.0.outputs.0}/checkpoints/best.pth"
preemptible = true
grace_seconds = 120
run_name = "{config_stem}_s{seed}"
defaults = { seed = 0 }
outputs = ["src/runs/{split}/{model}/{run_name}"]
min_gpu_mem_gb = 8

# One trial of a wandb sweep in the Sweeps project, e.g. 20 trials of sweep <id>:
#   for i in $(seq 20); do que2 submit base sweep sweep_id=<id> --group sweep-<id>; done
# The first attempt asks wandb for the trial's parameters and saves its resolved config; every
# attempt then trains it like `train`, resuming the same trial from its last epoch
# (src/sweep_trial.py), so the job is preemptible. Outputs go to
# src/runs/<split>/<model>/sweep_<id>/job<job id>/.
[templates.sweep]
command = "python -m src.sweep_trial {sweep_id}"
preemptible = true
grace_seconds = 120
min_gpu_mem_gb = 8
